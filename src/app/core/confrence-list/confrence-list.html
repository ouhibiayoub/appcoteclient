
<h2>Liste des conférences</h2>

<input
  type="text"
  placeholder="Rechercher une conférence..."
  [ngModel]="searchitem()"
  (ngModelChange)="searchitem.set($event)"
>

<div *ngFor="let conf of filter()">

  <h3>{{ conf.titre }}</h3>

  <p>{{ conf.description }}</p>
  <p>Lieu : {{ conf.lieu }}</p>
  <p>Prix : {{ conf.prix }} DT</p>
  <p>Likes : {{ conf.nbLikes }}</p>

  <button (click)="liker(conf)">
    Like ❤️
  </button>

  <button (click)="addFavorite(conf)">
    Ajouter aux favoris ⭐
  </button>

</div>

<h2>Mes favoris</h2>

<div *ngFor="let fav of favoritelist()">
  <p>{{ fav.titre }}</p>
</div>
